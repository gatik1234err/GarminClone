<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />

    <!-- SEO Meta Tags -->
    <title>Sign In | Garmin India</title>
    <meta
      name="description"
      content="Sign in to your Garmin account to access your fitness data, sync devices, and manage your Garmin experience."
    />

    <!-- Favicon -->
    <link
      rel="icon"
      type="image/svg+xml"
      href="./assets/logo/garmin-icon.svg"
    />

    <!-- Stylesheets -->
    <link rel="stylesheet" href="./styles/globals.css" />
    <link rel="stylesheet" href="./styles/navigation.css" />
    <link rel="stylesheet" href="./styles/login.css" />
    <link rel="stylesheet" href="./styles/footer.css" />
  </head>
  <body>
    <!-- Skip to Main Content -->
    <a href="#main-content" class="skip-link">Skip to main content</a>

    <!-- Minimal Navigation for Login Page -->
    <nav class="glass-nav login-nav" id="navbar" role="navigation">
      <div class="nav-container">
        <!-- Logo -->
        <a href="./index.html" class="brand-logo">GARMIN</a>

        <!-- Right Side Icons -->
        <div class="nav-icons">
          <!-- Search Icon -->
          <button class="icon-btn search-btn" aria-label="Search">
            <svg
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-linecap="round"
              stroke-linejoin="round"
            >
              <circle cx="11" cy="11" r="8"></circle>
              <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
            </svg>
          </button>

          <!-- Profile Icon (Active) -->
          <button class="icon-btn profile-btn active" aria-label="Account" aria-current="page">
            <svg
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-linecap="round"
              stroke-linejoin="round"
            >
              <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path>
              <circle cx="12" cy="7" r="4"></circle>
            </svg>
          </button>

          <!-- Mobile Menu Toggle -->
          <button
            class="mobile-toggle"
            id="mobileToggle"
            aria-label="Toggle mobile menu"
            aria-expanded="false"
          >
            <span></span>
            <span></span>
            <span></span>
          </button>
        </div>
      </div>
    </nav>

    <!-- Main Content -->
    <main id="main-content" class="login-page">
      <!-- Background Effects -->
      <div class="login-background"></div>
      <div class="login-grid"></div>

      <!-- Login Card -->
      <div class="login-container">
        <div class="login-card">
          <!-- Logo -->
          <div class="login-logo">
            <a href="./index.html">GARMIN</a>
          </div>

          <!-- Header -->
          <div class="login-header">
            <h1 class="login-title">Welcome Back</h1>
            <p class="login-subtitle">Sign in to access your Garmin account</p>
          </div>

          <!-- Error Message -->
          <div class="form-error" id="loginError">
            Invalid email or password. Please try again.
          </div>

          <!-- Success Message -->
          <div class="form-success" id="loginSuccess">
            Login successful! Redirecting...
          </div>

          <!-- Login Form -->
          <form class="login-form" id="loginForm" action="#" method="POST">
            <!-- Email -->
            <div class="form-group">
              <label for="email" class="form-label">Email Address</label>
              <input
                type="email"
                id="email"
                name="email"
                class="form-input"
                placeholder="Enter your email"
                required
                autocomplete="email"
              />
            </div>

            <!-- Password -->
            <div class="form-group">
              <label for="password" class="form-label">Password</label>
              <div class="password-wrapper">
                <input
                  type="password"
                  id="password"
                  name="password"
                  class="form-input"
                  placeholder="Enter your password"
                  required
                  autocomplete="current-password"
                />
                <button
                  type="button"
                  class="password-toggle"
                  id="passwordToggle"
                  aria-label="Toggle password visibility"
                >
                  <svg
                    viewBox="0 0 24 24"
                    fill="none"
                    stroke="currentColor"
                    stroke-linecap="round"
                    stroke-linejoin="round"
                    class="eye-open"
                  >
                    <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path>
                    <circle cx="12" cy="12" r="3"></circle>
                  </svg>
                  <svg
                    viewBox="0 0 24 24"
                    fill="none"
                    stroke="currentColor"
                    stroke-linecap="round"
                    stroke-linejoin="round"
                    class="eye-closed"
                    style="display: none;"
                  >
                    <path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"></path>
                    <line x1="1" y1="1" x2="23" y2="23"></line>
                  </svg>
                </button>
              </div>
            </div>

            <!-- Actions -->
            <div class="form-actions">
              <div class="remember-me">
                <input type="checkbox" id="remember" name="remember" />
                <label for="remember">Remember me</label>
              </div>
              <a href="#" class="forgot-password">Forgot password?</a>
            </div>

            <!-- Submit -->
            <button type="submit" class="login-submit">Sign In</button>
          </form>

          <!-- Divider -->
          <div class="login-divider">
            <span>or continue with</span>
          </div>

          <!-- Social Login -->
          <div class="social-login">
            <button type="button" class="social-btn" id="googleLogin">
              <svg viewBox="0 0 24 24">
                <path
                  fill="#4285F4"
                  d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"
                />
                <path
                  fill="#34A853"
                  d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"
                />
                <path
                  fill="#FBBC05"
                  d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z"
                />
                <path
                  fill="#EA4335"
                  d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z"
                />
              </svg>
              Continue with Google
            </button>
            <button type="button" class="social-btn" id="appleLogin">
              <svg viewBox="0 0 24 24" fill="currentColor">
                <path
                  d="M18.71 19.5c-.83 1.24-1.71 2.45-3.05 2.47-1.34.03-1.77-.79-3.29-.79-1.53 0-2 .77-3.27.82-1.31.05-2.3-1.32-3.14-2.53C4.25 17 2.94 12.45 4.7 9.39c.87-1.52 2.43-2.48 4.12-2.51 1.28-.02 2.5.87 3.29.87.78 0 2.26-1.07 3.81-.91.65.03 2.47.26 3.64 1.98-.09.06-2.17 1.28-2.15 3.81.03 3.02 2.65 4.03 2.68 4.04-.03.07-.42 1.44-1.38 2.83M13 3.5c.73-.83 1.94-1.46 2.94-1.5.13 1.17-.34 2.35-1.04 3.19-.69.85-1.83 1.51-2.95 1.42-.15-1.15.41-2.35 1.05-3.11z"
                />
              </svg>
              Continue with Apple
            </button>
          </div>

          <!-- Sign Up Link -->
          <div class="login-footer">
            <p>
              Don't have an account?
              <a href="#">Create one now</a>
            </p>
          </div>
        </div>
      </div>
    </main>

    <!-- JavaScript -->
    <script>
      // Password Toggle
      const passwordToggle = document.getElementById('passwordToggle');
      const passwordInput = document.getElementById('password');
      const eyeOpen = passwordToggle.querySelector('.eye-open');
      const eyeClosed = passwordToggle.querySelector('.eye-closed');

      passwordToggle.addEventListener('click', function () {
        const type = passwordInput.getAttribute('type') === 'password' ? 'text' : 'password';
        passwordInput.setAttribute('type', type);
        
        if (type === 'text') {
          eyeOpen.style.display = 'none';
          eyeClosed.style.display = 'block';
        } else {
          eyeOpen.style.display = 'block';
          eyeClosed.style.display = 'none';
        }
      });

      // Form Submission
      const loginForm = document.getElementById('loginForm');
      const loginError = document.getElementById('loginError');
      const loginSuccess = document.getElementById('loginSuccess');

      loginForm.addEventListener('submit', function (e) {
        e.preventDefault();
        
        // Hide previous messages
        loginError.classList.remove('show');
        loginSuccess.classList.remove('show');
        
        // Get form values
        const email = document.getElementById('email').value;
        const password = document.getElementById('password').value;
        
        // Basic validation
        if (email && password) {
          // Simulate login success
          loginSuccess.classList.add('show');
          
          // Redirect after 2 seconds
          setTimeout(() => {
            window.location.href = './index.html';
          }, 2000);
        } else {
          loginError.classList.add('show');
        }
      });

      // Social Login Buttons
      document.getElementById('googleLogin').addEventListener('click', function() {
        // Google OAuth simulation
        alert('Google Sign-In would open here');
      });

      document.getElementById('appleLogin').addEventListener('click', function() {
        // Apple OAuth simulation
        alert('Apple Sign-In would open here');
      });
    </script>
  </body>
</html>
